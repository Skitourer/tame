# --- Help (tk help). No braces in bodies: they go through str.format. ----------------

[print]
title = "Tasks"
title_filtered = "Tasks: {filter}"
no_project = "No project"
count = "{count} tasks"
count_one = "1 task"
due = "due {date}"
today = "today"
late = "late"
footer = "Printed with TAME"

[about]
license_header = "TAME is released under the MIT License:"
license_missing = "MIT License. Full text: https://github.com/Skitourer/tame/blob/main/LICENSE"
libraries = "Libraries installed with TAME, and their licenses:"

[help]
usage = "Usage: tk [filter] <command> [arguments]   (no command = list)"
usage_label = "Usage: {usage}"
commands = "Commands:"
topics = "Topics: tk help {topics}"
more = "Details: tk help <command>, or tk <command> --help. Commands can be shortened: tk mod."

[help.settings]
intro = "Settings, in config.toml (tk config path). Change one with tk config set KEY VALUE,\nback to its default with tk config unset KEY."
values = "Values: {values}. Default: {default}."
current = "Current value: {value}."
more = "One setting: tk help config KEY. All current values: tk config."

[help.cmd.add]
summary = "Create a task"
usage = "tk add <description> [project:P] [pri:H|M|L] [due:DATE] [wait:DATE] [depends:IDS] [recur:PERIOD] [until:DATE] [+tag ...]"
body = '''
Words make the description; project:, pri:, due:, wait:, depends: and +tag can be
anywhere. wait: hides the task from list and filters until that date (tk +WAITING
shows it). depends:3,4 makes it wait for tasks 3 and 4 (see tk help modify).
recur: makes it repeat (see tk help done): daily, weekly, biweekly, monthly,
quarterly, yearly, weekdays (Monday to Friday), or a count: 3d, 2w, 6m, 1y. It needs
a due date; until: ends the series.
Everything after -- is description, even words like +1 or pri:H.

Examples:
  tk add Call bank project:home +phone due:fri pri:H
  tk add Chase the bank wait:mon due:fri
  tk add Paint the walls depends:2
  tk add Backup due:fri recur:weekly until:eoy
  tk add -- +1 vote for the new logo
'''

[help.cmd.next]
summary = "Show the most urgent tasks you can do now"
usage = "tk [filter] next"
body = '''
Like list, but shows only the next_limit most urgent tasks (10 by default), leaves
out blocked tasks (+BLOCKED: waiting for another pending task) and the Age and Tags
columns. The last lines tell how many tasks match in all.

Make it what tk alone runs: tk config set default_command next

Examples:
  tk next
  tk +home next
'''

[help.cmd.list]
summary = "List tasks, most urgent first"
usage = "tk [filter] list"
body = '''
Shows pending tasks matching the filter (see tk help filters); status:completed,
status:deleted or status:all shows the others, pending ones first. Empty columns are
hidden. The due date (and id) of overdue tasks is red, of tasks due today yellow.
Urg is the urgency (see tk help urgency). A last line counts the tasks, overdue and
due today.

Examples:
  tk                        all pending tasks
  tk project:home           also: tk list project:home
  tk +phone -work bank
  tk status:completed list
'''

[help.cmd.info]
summary = "Show every field of tasks"
usage = "tk [filter] info"
body = '''
Shows all fields of the matching tasks, in local time: the task, its dates (with
how long ago, or how soon), its notes, then its uuid.

Examples:
  tk 7 info
  tk status:deleted info
'''

[help.cmd.modify]
summary = "Change tasks"
usage = "tk <filter> modify [attr:value] [attr:] [+tag] [-tag] [new description]"
body = '''
attr:value sets an attribute, attr: clears it (project, pri, due, wait, recur, until);
+tag and -tag add and remove tags; other words replace the description. A filter is
required. recur: ends a series (until: with it); a recurring task keeps its due date.

depends:3,4 adds tasks 3 and 4 to the ones this task waits for (ids, ranges or
uuids), depends:-3 removes one, depends: removes them all. While one is pending,
the task is +BLOCKED: next leaves it out and its urgency drops; the task it waits
for is +BLOCKING and gains urgency. A task cannot depend on itself, nor through a
cycle.
Asks before changing more than confirm_threshold tasks (default 3); --yes skips it.

Examples:
  tk 12 modify due:mon -phone
  tk 3 modify project: Call the bank
  tk 5 modify depends:3,4
  tk 5 modify depends:-3
  tk 7 modify recur:monthly until:2027-06-30
  tk +phone modify pri:L --yes
'''

[help.cmd.annotate]
summary = "Add a note to tasks"
usage = "tk <filter> annotate <text>"
body = '''
Adds a dated note to each matching task. tk info shows the notes, tk print prints
them under the task, and list shows how many a task has: Call bank [2]. A filter is
required. Asks before changing more than confirm_threshold tasks; --yes skips it.

Examples:
  tk 3 annotate Call back Monday, ask for Ann
  tk 3 annotate -- Answer --yes by mail   (after --, words are text)
'''

[help.cmd.denotate]
summary = "Remove a note from tasks"
usage = "tk <filter> denotate [text]"
body = '''
Removes one note from each matching task: the one with exactly this text (any case),
else the only one containing it, else, without text, the most recent. If several
notes contain the text, nothing is removed: give more of it.

Examples:
  tk 3 denotate Call back
  tk 3 denotate                      (the most recent note)
'''

[help.cmd.start]
summary = "Start working on a task"
usage = "tk <filter> start [--yes]"
body = '''
Marks the task as started (+ACTIVE) and counts the time until tk stop. Started tasks
gain urgency (urgency.active) and the Active column of list and next shows how long
they have been running. tk info shows the time spent, all sessions added up.

Only one task runs at a time: starting one stops the other (set multiple_active to
true to allow several). done and delete stop a task first, keeping its time.

Examples:
  tk 3 start
  tk +ACTIVE list
'''

[help.cmd.stop]
summary = "Stop working on tasks"
usage = "tk [filter] stop"
body = '''
Stops the active tasks, all of them or those the filter picks, and records the time
spent since tk start. Nothing active: exit code 2.

Examples:
  tk stop
  tk 3 stop
'''

[help.cmd.done]
summary = "Mark tasks completed"
usage = "tk <filter> done [--yes]"
body = '''
A filter is required. Asks before completing more than confirm_threshold tasks
(default 3); --yes skips it. Pending tasks are then renumbered 1..n.

A recurring task (recur:) comes back: the same task is created, due one period after
the planned due date (dates already past are skipped), with its project, tags,
priority and wait: moved by as much; notes and dependencies stay behind. Monthly
tasks keep their day: Jan 31, Feb 28, Mar 31. After until:, the series ends.
delete ends it too. tk undo reverts both.

Examples:
  tk 3 done
  tk 3,5 done
  tk +shopping done --yes
'''

[help.cmd.delete]
summary = "Delete tasks"
usage = "tk <filter> delete [--yes]"
body = '''
A filter is required. Always asks first; --yes skips it. Deleted tasks are kept with
status:deleted, and tk undo brings them back. Pending tasks are then renumbered 1..n.
tk purge erases deleted tasks for good.

Examples:
  tk 4 delete
  tk project:old delete --yes
'''

[help.cmd.undo]
summary = "Revert the last change"
usage = "tk undo"
body = '''
Reverts the last add, done, delete, modify, annotate, denotate, start, stop or import, ids included. Run it again to go
further back. History older than undo.retention (default 3 months) is purged; see
tk help config. tk purge clears the whole history.
'''

[help.cmd.purge]
summary = "Erase deleted tasks for good"
usage = "tk [filter] purge [--yes] | tk purge --all"
body = '''
Erases deleted tasks (status:deleted) for good, with their notes and the links other
tasks have to them. A filter picks some of them (project:old, a uuid); without one,
every deleted task goes. Always asks first; --yes skips it.

--all erases every task, whatever its status: after the y/N question, type the word
purge to confirm (--yes never skips this step; a terminal is required).

Before any purge, a copy of the database is saved next to it, as
tame-YYYYMMDD-HHMMSS.db.bak, and its path is shown: copy it back over tasks.db to
recover. TAME never removes these copies. A purge cannot be undone: it clears the
tk undo history. Type the full name: tk p is still print.

Examples:
  tk purge
  tk project:old purge --yes
  tk purge --all
'''

[help.cmd.export]
summary = "Export tasks as Taskwarrior JSON"
usage = "tk [filter] export"
body = '''
Prints the matching tasks as a JSON array in Taskwarrior format, one task per line;
an empty array if none match. Like list, only pending tasks by default: status:all
exports everything (for a backup). Attributes kept from an import come back as they
were.

Examples:
  tk status:all export > backup.json
  tk project:home export > home.json
'''

[help.cmd.import]
summary = "Import Taskwarrior JSON"
usage = "tk import [FILE | -]"
body = '''
Reads a JSON array, or one task object per line, from FILE or standard input
(no FILE, or -). Tasks are merged by uuid: new ones are added, a stored task is
replaced only if the incoming one was modified later. Attributes TAME does not use
(UDAs...) are kept for export. Waiting tasks become pending. A recurring series
(template and instances) becomes one recurring task: the nearest pending instance,
the others plain tasks. tk undo reverts the whole import.

Examples:
  task export > tw.json        (in Taskwarrior)
  tk import tw.json
  tk status:all export | tk import -
'''

[help.cmd.print]
summary = "Print tasks, grouped by project"
usage = "tk [filter] print [--file PATH]"
body = '''
Makes a printable page of the matching tasks, one section per project, with a box to
tick for each task, and opens it in your browser with the print dialog: pick a
printer, or save as PDF. Like list, only pending tasks by default. --file PATH saves
the page (HTML) without opening it.

Examples:
  tk print
  tk +shopping print
  tk project:home due.before:eow print
  tk print --file tasks.html
'''

[help.cmd.config]
summary = "Show or change settings"
usage = "tk config [get KEY | set KEY VALUE | unset KEY | path | edit]"
body = '''
Settings live in config.toml; edit it by hand or with this command. Without
arguments, lists all settings; changed ones show their default. unset restores the
default; edit opens the file in $EDITOR (Notepad on Windows).

Every setting, what it does and its values: tk help settings
One setting: tk help config KEY (for example tk help config date_format)

Examples:
  tk help settings                     what each setting does, and its values
  tk config set language fr            French interface
  tk config set undo.retention 1y      keep undo history 1 year (or: forever)
  tk config set date_format %d/%m/%Y
  tk config unset date_format
'''

[help.cmd.alias]
summary = "Add or remove a command alias, such as task"
usage = "tk alias install NAME | tk alias remove NAME"
body = '''
Creates a small launcher NAME (NAME.cmd on Windows) running tame, next to the tame and
tk commands (the uv tool directory, usually ~/.local/bin). Handy if your fingers type
task. Not done by default: task is also the Taskwarrior and go-task command. Warns if
another NAME comes first in PATH. remove deletes only launchers created by tame.

Examples:
  tk alias install task
  task add Call bank
  tk alias remove task
'''

[completion]
tip = "Tip: Tab completion is available: tk config set completion true"
enabled = "Tab completion enabled in {path}. Open a new terminal to use it."
already = "Tab completion is on in {path}."
removed = "Tab completion removed from {path}."
blocked = "Tab completion not enabled in {path}: PowerShell does not run profile scripts here (execution policy {policy}). To allow them: Set-ExecutionPolicy -Scope CurrentUser RemoteSigned"
none = "Tab completion: no supported shell found (PowerShell, or bash as your shell). See tk help completion."
error = "Tab completion: cannot update the shell profile: {detail}"

[help.cmd.completion]
summary = "Set up Tab completion in your shell"
usage = "tk completion powershell | bash"
body = '''
To turn Tab completion on, you do not need this command:
  tk config set completion true
TAME then keeps its block in your PowerShell (or bash) profile up to date; false
removes it. Not available in cmd.exe.

This command only prints the script, for other setups: shells or profiles TAME does
not manage, or your own dotfiles. Always current, but a slower terminal start:
  tk completion powershell | Out-String | Invoke-Expression
'''

[help.cmd.help]
summary = "Show help"
usage = "tk help [command | topic]"
body = '''
Without arguments, lists commands and topics. tk <command> --help does the same as
tk help <command>.

Examples:
  tk help modify
  tk help mod
  tk help dates
'''

[help.cmd.version]
summary = "Show the version"
usage = "tk version"
body = '''
Shows the tame version and the database schema version.
'''

[help.topic]
filters = '''
Filters select tasks. All criteria must match; ids and uuids together form one
selection. Without status:, only pending tasks match.

  3   3,5   2-6        short ids
  1a2b3c4d             uuid prefix (8+ hex characters)
  +tag   -tag          has / lacks the tag
  +OVERDUE  -TAGGED    has / lacks a virtual tag (below)
  project:home         project home and its sub-projects (home.garden)
  project:             no project
  pri:H   pri:         priority H / no priority
  status:completed     pending, completed, deleted, or all
  due.before:fri       due strictly before the date (see tk help dates)
  due.after:today      due strictly after the date
  recur:weekly         repeats every week (2w = biweekly); recur: not recurring
  other words          text contained in the description, any case

Virtual tags are computed, never set (pending tasks only, but the last three):
  OVERDUE              due date passed
  TODAY  TOMORROW      due today / tomorrow
  WEEK  MONTH          due this week (Monday to Sunday) / this month
  DUE                  due in the next 7 days
  BLOCKED  UNBLOCKED   waiting / not waiting for another pending task
  BLOCKING             another pending task waits for it
  ACTIVE               started with tk start
  RECURRING            repeats (recur:)
  WAITING              hidden by wait: until a later date
  ANNOTATED            has an annotation
  PROJECT  TAGGED      has a project / at least one tag

Waiting tasks (wait: in the future) are left out, unless the filter has ids,
+WAITING or status:all. export always includes them.

The filter goes before the command (tk +phone list) or right after it
(tk list +phone). After --, everything is plain words.
'''
dates = '''
Dates are used by due:, wait:, until:, due.before: and due.after:. Keywords are English, any case.
A date without a time means 00:00 local time.

  2026-12-15   2026-12-15T14:00     ISO date, local time
  today   tomorrow   yesterday
  monday .. sunday, mon .. sun      next occurrence, never today
  eow   eom   eoy                   end of week (Sunday), month, year: 23:59:59
  +3d   +2w   +1m   +4h   -1d       from now (d days, w weeks, m months, h hours)

Examples:
  tk add Pay rent due:eom
  tk 3 modify due:+2w
  tk due.before:fri list
'''
security = '''
TAME does not encrypt your tasks. They are stored in a plain SQLite file, tasks.db,
in the data folder (%APPDATA%\tame on Windows); files written by print --file and
export are plain too. Anyone who can read your files can read your tasks.

To protect them, use what Windows already provides:
  BitLocker   encrypts the whole disk; often already on for work computers
              (Settings > Privacy & security > Device encryption).
  EFS         encrypts a folder for your Windows account only. Run once:
                cipher /e /s:"%APPDATA%\tame"
              Not available on Windows Home editions.

Why TAME does not encrypt the file itself: Python's sqlite3 cannot read an
encrypted database, so TAME would have to write a decrypted copy to disk while it
works (the tasks would sit there in plain text), and ask for a password and derive
a key at every command, which makes each tk slower. An encrypted export, for
backups and moving between computers, is planned with sync.
'''
urgency = '''
Tasks are listed by urgency, the sum of:

  priority     H 6.0, M 3.9, L 1.8
  due date     12.0 x 0.2 (due in 14+ days) up to x 1.0 (7+ days overdue)
  age          2.0 x age in years, at most 1 year
  tags         1.0 if the task has tags
  project      1.0 if the task has a project
  blocked      -5.0 if it waits for another pending task (depends:)
  blocking     8.0 if another pending task waits for it
  active       4.0 while the task is started (tk start)

Change the weights with tk config set urgency.<name> <value>, for example
tk config set urgency.due 8.
'''

tour = '''
A two-minute tour. Type the commands in order.

1. Add tasks. Words make the description; project:, pri:, due: and +tag go anywhere.
     tk add Call the bank project:home pri:H due:fri +phone
     tk add Buy milk +shopping due:tomorrow
     tk add Plan holidays project:home

2. List them, most urgent first (priority, due date, age, tags, project add up).
     tk
     tk next                    only the most urgent you can do now
     tk 1 info                  every field of task 1

3. Change them: attr:value sets, attr: clears, +tag/-tag, other words = description.
     tk 2 modify pri:M -shopping
     tk 3 modify due:+2w
     tk 1 annotate Ask for Ann  a dated note
     tk 3 modify wait:+1w       hidden for a week (tk +WAITING shows it)

4. Complete one (pending tasks are then renumbered). Changed your mind? undo reverts
   any change.
     tk 2 done
     tk undo
     tk 2 done

5. Filter: tags, project, priority, words, dates (see tk help filters, tk help dates).
     tk +phone
     tk project:home due.before:+2w
     tk status:completed list

6. Make it yours.
     tk config set language fr  French interface
     tk alias install task      also run tame as task
     tk config set completion true   Tab completion in new terminals
     tk status:all export > backup.json

Every command: tk help. Details: tk help <command>.
'''

