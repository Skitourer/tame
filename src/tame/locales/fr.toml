[help.cmd.add]
summary = "Créer une tâche"
usage = "tk add <description> [project:P] [pri:H|M|L] [due:DATE] [wait:DATE] [depends:IDS] [recur:PÉRIODE] [until:DATE] [+tag ...]"
body = '''
Les mots forment la description ; project:, pri:, due:, wait:, depends: et +tag
peuvent être n'importe où. wait: cache la tâche de list et des filtres jusqu'à cette
date (tk +WAITING l'affiche). depends:3,4 la fait attendre les tâches 3 et 4 (voir
tk help modify). recur: la fait revenir (voir tk help done) : daily, weekly,
biweekly, monthly, quarterly, yearly, weekdays (du lundi au vendredi), ou un nombre :
3d, 2w, 6m, 1y. Il faut une échéance ; until: termine la série.
Tout ce qui suit -- est de la description, même des mots comme +1 ou pri:H.

Exemples :
  tk add Appeler la banque project:maison +tel due:fri pri:H
  tk add Relancer la banque wait:mon due:fri
  tk add Peindre les murs depends:2
  tk add Sauvegarde due:fri recur:weekly until:eoy
  tk add -- +1 pour le nouveau logo
'''

[help.cmd.next]
summary = "Afficher les tâches les plus urgentes à faire maintenant"
usage = "tk [filtre] next"
body = '''
Comme list, mais n'affiche que les next_limit tâches les plus urgentes (10 par
défaut), sans les tâches bloquées (+BLOCKED : en attente d'une autre tâche en cours)
ni les colonnes Âge et Tags. Les dernières lignes indiquent combien de tâches
correspondent en tout.

Pour que tk tout seul l'affiche : tk config set default_command next

Exemples :
  tk next
  tk +maison next
'''

[help.cmd.list]
summary = "Lister les tâches, les plus urgentes d'abord"
usage = "tk [filtre] list"
body = '''
Affiche les tâches en cours qui correspondent au filtre (voir tk help filters) ;
status:completed, status:deleted ou status:all affiche les autres, celles en cours
d'abord. Les colonnes vides sont masquées. L'échéance (et l'id) des tâches en retard
est en rouge, celle des tâches du jour en jaune. Urg est l'urgence (voir
tk help urgency). Une dernière ligne compte les tâches, en retard et du jour.

Exemples :
  tk                        toutes les tâches en cours
  tk project:maison         aussi : tk list project:maison
  tk +tel -travail banque
  tk status:completed list
'''

[help.cmd.info]
summary = "Afficher tous les champs des tâches"
usage = "tk [filtre] info"
body = '''
Affiche tous les champs des tâches trouvées, en heure locale : la tâche, ses dates
(il y a combien de temps, ou dans combien), ses notes, puis son uuid.

Exemples :
  tk 7 info
  tk status:deleted info
'''

[help.cmd.modify]
summary = "Modifier des tâches"
usage = "tk <filtre> modify [attr:valeur] [attr:] [+tag] [-tag] [nouvelle description]"
body = '''
attr:valeur fixe un attribut, attr: l'efface (project, pri, due, wait, recur, until) ;
+tag et -tag ajoutent et retirent des tags ; les autres mots remplacent la
description. Un filtre est obligatoire. recur: arrête une série (et until: avec) ;
une tâche récurrente garde son échéance.

depends:3,4 ajoute les tâches 3 et 4 à celles que la tâche attend (ids, plages ou
uuids), depends:-3 en retire une, depends: les retire toutes. Tant que l'une est en
cours, la tâche est +BLOCKED : next la laisse de côté et son urgence baisse ; la
tâche attendue est +BLOCKING et gagne en urgence. Une tâche ne peut pas dépendre
d'elle-même, ni à travers un cycle. Demande confirmation au-delà de confirm_threshold tâches (3 par
défaut) ; --yes l'évite.

Exemples :
  tk 12 modify due:mon -tel
  tk 3 modify project: Appeler la banque
  tk 5 modify depends:3,4
  tk 5 modify depends:-3
  tk 7 modify recur:monthly until:2027-06-30
  tk +tel modify pri:L --yes
'''

[help.cmd.annotate]
summary = "Ajouter une note à des tâches"
usage = "tk <filtre> annotate <texte>"
body = '''
Ajoute une note datée à chaque tâche correspondante. tk info affiche les notes,
tk print les imprime sous la tâche, et list indique combien une tâche en a :
Appeler la banque [2]. Un filtre est obligatoire. Demande confirmation au-delà de
confirm_threshold tâches ; --yes l'évite.

Exemples :
  tk 3 annotate Rappeler lundi, demander Mme Martin
  tk 3 annotate -- Répondre --yes par mail   (après --, les mots sont du texte)
'''

[help.cmd.denotate]
summary = "Retirer une note de tâches"
usage = "tk <filtre> denotate [texte]"
body = '''
Retire une note de chaque tâche correspondante : celle qui a exactement ce texte
(casse ignorée), sinon la seule qui le contient, sinon, sans texte, la plus récente.
Si plusieurs notes contiennent le texte, rien n'est retiré : précisez-le.

Exemples :
  tk 3 denotate Rappeler
  tk 3 denotate                      (la note la plus récente)
'''

[help.cmd.start]
summary = "Commencer à travailler sur une tâche"
usage = "tk <filtre> start [--yes]"
body = '''
Marque la tâche comme démarrée (+ACTIVE) et compte le temps jusqu'à tk stop. Les
tâches démarrées gagnent en urgence (urgency.active) et la colonne Active de list et
next indique depuis combien de temps elles tournent. tk info affiche le temps passé,
toutes sessions additionnées.

Une seule tâche tourne à la fois : en démarrer une arrête l'autre (mettez
multiple_active à true pour en permettre plusieurs). done et delete arrêtent d'abord
la tâche, en gardant son temps.

Exemples :
  tk 3 start
  tk +ACTIVE list
'''

[help.cmd.stop]
summary = "Arrêter de travailler sur des tâches"
usage = "tk [filtre] stop"
body = '''
Arrête les tâches actives, toutes ou celles que choisit le filtre, et enregistre le
temps passé depuis tk start. Rien d'actif : code de sortie 2.

Exemples :
  tk stop
  tk 3 stop
'''

[help.cmd.done]
summary = "Marquer des tâches terminées"
usage = "tk <filtre> done [--yes]"
body = '''
Un filtre est obligatoire. Demande confirmation au-delà de confirm_threshold tâches
(3 par défaut) ; --yes l'évite. Les tâches en cours sont ensuite renumérotées 1..n.

Une tâche récurrente (recur:) revient : la même tâche est créée, due une période
après l'échéance prévue (les dates déjà passées sont sautées), avec son projet, ses
tags, sa priorité et son wait: décalé d'autant ; les notes et les dépendances
restent sur l'ancienne. Une tâche mensuelle garde son jour : 31 janv., 28 févr.,
31 mars. Après until:, la série s'arrête ; delete l'arrête aussi. tk undo annule
les deux.

Exemples :
  tk 3 done
  tk 3,5 done
  tk +courses done --yes
'''

[help.cmd.delete]
summary = "Supprimer des tâches"
usage = "tk <filtre> delete [--yes]"
body = '''
Un filtre est obligatoire. Demande toujours confirmation ; --yes l'évite. Les tâches
supprimées sont gardées avec status:deleted, et tk undo les fait revenir. Les tâches
en cours sont ensuite renumérotées 1..n. tk purge efface définitivement les tâches
supprimées.

Exemples :
  tk 4 delete
  tk project:ancien delete --yes
'''

[help.cmd.undo]
summary = "Annuler la dernière modification"
usage = "tk undo"
body = '''
Annule le dernier add, done, delete, modify, annotate, denotate, start, stop ou import, ids
compris. Relancez-le pour remonter plus loin. L'historique plus ancien que undo.retention (3 mois par défaut) est purgé ;
voir tk help config. tk purge efface tout l'historique.
'''

[help.cmd.purge]
summary = "Effacer définitivement les tâches supprimées"
usage = "tk [filtre] purge [--yes] | tk purge --all"
body = '''
Efface définitivement les tâches supprimées (status:deleted), avec leurs notes et les
liens que d'autres tâches ont vers elles. Un filtre en choisit certaines
(project:ancien, un uuid) ; sans filtre, toutes les tâches supprimées partent.
Demande toujours confirmation ; --yes l'évite.

--all efface toutes les tâches, quel que soit leur statut : après la question y/N,
tapez le mot purge pour confirmer (--yes ne saute jamais cette étape ; un terminal
est nécessaire).

Avant toute purge, une copie de la base est enregistrée à côté, sous le nom
tame-AAAAMMJJ-HHMMSS.db.bak, et son chemin est affiché : recopiez-la sur tasks.db
pour revenir en arrière. TAME ne supprime jamais ces copies. Une purge ne s'annule
pas : elle vide l'historique de tk undo. Tapez le nom en entier : tk p reste print.

Exemples :
  tk purge
  tk project:ancien purge --yes
  tk purge --all
'''

[help.cmd.export]
summary = "Exporter les tâches en JSON Taskwarrior"
usage = "tk [filtre] export"
body = '''
Affiche les tâches trouvées sous forme de tableau JSON au format Taskwarrior, une
tâche par ligne ; un tableau vide si aucune ne correspond. Comme list, seulement les
tâches en cours par défaut : status:all exporte tout (pour une sauvegarde). Les
attributs conservés lors d'un import reviennent tels quels.

Exemples :
  tk status:all export > sauvegarde.json
  tk project:maison export > maison.json
'''

[help.cmd.import]
summary = "Importer du JSON Taskwarrior"
usage = "tk import [FICHIER | -]"
body = '''
Lit un tableau JSON, ou un objet tâche par ligne, depuis FICHIER ou l'entrée standard
(sans FICHIER, ou -). Les tâches sont fusionnées par uuid : les nouvelles sont
ajoutées, une tâche existante n'est remplacée que si celle importée a été modifiée
plus tard. Les attributs que TAME n'utilise pas (UDA...) sont gardés pour l'export.
Les tâches waiting deviennent pending. Une série récurrente (modèle et instances)
devient une seule tâche récurrente : l'instance en cours la plus proche, les autres
devenant des tâches simples. tk undo annule tout l'import.

Exemples :
  task export > tw.json        (dans Taskwarrior)
  tk import tw.json
  tk status:all export | tk import -
'''

[help.cmd.print]
summary = "Imprimer les tâches, par projet"
usage = "tk [filtre] print [--file CHEMIN]"
body = '''
Crée une page imprimable des tâches trouvées, une section par projet, avec une case à
cocher pour chaque tâche, et l'ouvre dans votre navigateur avec la fenêtre
d'impression : choisissez une imprimante, ou enregistrez en PDF. Comme list,
seulement les tâches en cours par défaut. --file CHEMIN enregistre la page (HTML)
sans l'ouvrir.

Exemples :
  tk print
  tk +courses print
  tk project:maison due.before:eow print
  tk print --file taches.html
'''

[help.cmd.config]
summary = "Afficher ou changer les réglages"
usage = "tk config [get CLÉ | set CLÉ VALEUR | unset CLÉ | path | edit]"
body = '''
Les réglages sont dans config.toml ; modifiez-le à la main ou avec cette commande.
Sans argument, liste tous les réglages ; ceux qui ont changé montrent leur valeur par
défaut. unset rétablit le défaut ; edit ouvre le fichier dans $EDITOR (Notepad sous
Windows).

Chaque réglage, son rôle et ses valeurs : tk help settings
Un seul réglage : tk help config CLÉ (par exemple tk help config date_format)

Exemples :
  tk help settings                     le rôle de chaque réglage, et ses valeurs
  tk config set language fr            interface en français
  tk config set undo.retention 1y      garder l'historique 1 an (ou : forever)
  tk config set date_format %d/%m/%Y
  tk config unset date_format
'''

[help.cmd.alias]
summary = "Ajouter ou retirer un alias de commande, comme task"
usage = "tk alias install NOM | tk alias remove NOM"
body = '''
Crée un petit lanceur NOM (NOM.cmd sous Windows) qui lance tame, à côté des commandes
tame et tk (le dossier des outils uv, en général ~/.local/bin). Pratique si vos doigts
tapent task. Pas fait par défaut : task est aussi la commande de Taskwarrior et de
go-task. Prévient si un autre NOM passe avant dans le PATH. remove ne supprime que les
lanceurs créés par tame.

Exemples :
  tk alias install task
  task add Appeler la banque
  tk alias remove task
'''

[completion]
tip = "Astuce : la complétion par Tab est disponible : tk config set completion true"
enabled = "Complétion par Tab activée dans {path}. Ouvrez un nouveau terminal pour l'utiliser."
already = "La complétion par Tab est active dans {path}."
removed = "Complétion par Tab retirée de {path}."
blocked = "Complétion par Tab non activée dans {path} : PowerShell n'exécute pas les scripts de profil ici (stratégie d'exécution {policy}). Pour les autoriser : Set-ExecutionPolicy -Scope CurrentUser RemoteSigned"
none = "Complétion par Tab : aucun shell pris en charge trouvé (PowerShell, ou bash comme shell). Voir tk help completion."
error = "Complétion par Tab : impossible de mettre à jour le profil du shell : {detail}"

[help.cmd.completion]
summary = "Activer la complétion par Tab dans votre shell"
usage = "tk completion powershell | bash"
body = '''
Pour activer la complétion par Tab, cette commande n'est pas nécessaire :
  tk config set completion true
TAME tient alors à jour son bloc dans votre profil PowerShell (ou bash) ; false le
retire. Indisponible dans cmd.exe.

Cette commande affiche seulement le script, pour d'autres installations : shells ou
profils que TAME ne gère pas, ou vos propres fichiers de configuration. Toujours à
jour, mais un démarrage du terminal plus lent :
  tk completion powershell | Out-String | Invoke-Expression
'''

[help.cmd.help]
summary = "Afficher l'aide"
usage = "tk help [commande | sujet]"
body = '''
Sans argument, liste les commandes et les sujets. tk <commande> --help équivaut à
tk help <commande>.

Exemples :
  tk help modify
  tk help mod
  tk help dates
'''

[help.cmd.version]
summary = "Afficher la version"
usage = "tk version"
body = '''
Affiche la version de tame et celle du schéma de la base.
'''

[help.topic]
filters = '''
Les filtres sélectionnent des tâches. Tous les critères doivent correspondre ; ids et
uuids forment ensemble une seule sélection. Sans status:, seules les tâches en cours
correspondent.

  3   3,5   2-6        ids courts
  1a2b3c4d             début d'uuid (8 caractères hexa ou plus)
  +tag   -tag          a / n'a pas le tag
  +OVERDUE  -TAGGED    a / n'a pas le tag virtuel (ci-dessous)
  project:maison       projet maison et ses sous-projets (maison.jardin)
  project:             sans projet
  pri:H   pri:         priorité H / sans priorité
  status:completed     pending, completed, deleted, ou all
  due.before:fri       échéance strictement avant la date (voir tk help dates)
  due.after:today      échéance strictement après la date
  recur:weekly         revient chaque semaine (2w = biweekly) ; recur: non récurrente
  autres mots          texte contenu dans la description, casse ignorée

Les tags virtuels sont calculés, jamais posés (tâches en cours seulement, sauf les
trois derniers) :
  OVERDUE              échéance dépassée
  TODAY  TOMORROW      échéance aujourd'hui / demain
  WEEK  MONTH          échéance cette semaine (lundi à dimanche) / ce mois-ci
  DUE                  échéance dans les 7 prochains jours
  BLOCKED  UNBLOCKED   attend / n'attend pas une autre tâche en cours
  BLOCKING             une autre tâche en cours l'attend
  ACTIVE               démarrée avec tk start
  RECURRING            revient (recur:)
  WAITING              cachée par wait: jusqu'à une date à venir
  ANNOTATED            a une annotation
  PROJECT  TAGGED      a un projet / au moins un tag

Les tâches en attente (wait: dans le futur) sont écartées, sauf si le filtre a des
ids, +WAITING ou status:all. export les inclut toujours.

Le filtre se place avant la commande (tk +tel list) ou juste après
(tk list +tel). Après --, tout est mots simples.
'''
dates = '''
Les dates servent à due:, wait:, until:, due.before: et due.after:. Les mots-clés sont en anglais,
casse ignorée. Une date sans heure signifie 00:00 heure locale.

  2026-12-15   2026-12-15T14:00     date ISO, heure locale
  today   tomorrow   yesterday      aujourd'hui, demain, hier
  monday .. sunday, mon .. sun      prochaine occurrence, jamais aujourd'hui
  eow   eom   eoy                   fin de semaine (dimanche), mois, année : 23:59:59
  +3d   +2w   +1m   +4h   -1d       depuis maintenant (d jours, w semaines, m mois, h heures)

Exemples :
  tk add Payer le loyer due:eom
  tk 3 modify due:+2w
  tk due.before:fri list
'''
security = '''
TAME ne chiffre pas vos tâches. Elles sont stockées dans un fichier SQLite en clair,
tasks.db, dans le dossier de données (%APPDATA%\tame sous Windows) ; les fichiers
écrits par print --file et export sont en clair aussi. Quiconque peut lire vos
fichiers peut lire vos tâches.

Pour les protéger, utilisez ce que Windows fournit déjà :
  BitLocker   chiffre tout le disque ; souvent déjà actif sur les PC de travail
              (Paramètres > Confidentialité et sécurité > Chiffrement de l'appareil).
  EFS         chiffre un dossier pour votre seul compte Windows. Une fois :
                cipher /e /s:"%APPDATA%\tame"
              Absent des éditions Famille de Windows.

Pourquoi TAME ne chiffre pas le fichier lui-même : le sqlite3 de Python ne sait pas
lire une base chiffrée. TAME devrait donc écrire une copie déchiffrée sur le disque
pendant son travail (les tâches y seraient en clair), et demander un mot de passe et
dériver une clé à chaque commande, ce qui ralentit chaque tk. Un export chiffré, pour
les sauvegardes et le passage d'un ordinateur à l'autre, est prévu avec la synchro.
'''
urgency = '''
Les tâches sont listées par urgence, la somme de :

  priorité     H 6.0, M 3.9, L 1.8
  échéance     12.0 x 0.2 (dans 14 jours ou plus) jusqu'à x 1.0 (7 jours de retard ou plus)
  âge          2.0 x âge en années, au plus 1 an
  tags         1.0 si la tâche a des tags
  projet       1.0 si la tâche a un projet
  bloquée      -5.0 si elle attend une autre tâche en cours (depends:)
  bloquante    8.0 si une autre tâche en cours l'attend
  active       4.0 tant que la tâche est démarrée (tk start)

Changez les poids avec tk config set urgency.<nom> <valeur>, par exemple
tk config set urgency.due 8.
'''

tour = '''
Une visite de deux minutes. Tapez les commandes dans l'ordre.

1. Ajoutez des tâches. Les mots forment la description ; project:, pri:, due: et +tag
   vont n'importe où.
     tk add Appeler la banque project:maison pri:H due:fri +tel
     tk add Acheter du lait +courses due:tomorrow
     tk add Préparer les vacances project:maison

2. Listez-les, les plus urgentes d'abord (priorité, échéance, âge, tags et projet
   s'additionnent).
     tk
     tk next                    seulement les plus urgentes à faire maintenant
     tk 1 info                  tous les champs de la tâche 1

3. Modifiez-les : attr:valeur fixe, attr: efface, +tag/-tag, les autres mots
   remplacent la description.
     tk 2 modify pri:M -courses
     tk 3 modify due:+2w
     tk 1 annotate Demander Mme Martin   une note datée
     tk 3 modify wait:+1w       cachée une semaine (tk +WAITING l'affiche)

4. Terminez-en une (les tâches en cours sont alors renumérotées). Changé d'avis ? undo
   annule n'importe quel changement.
     tk 2 done
     tk undo
     tk 2 done

5. Filtrez : tags, projet, priorité, mots, dates (voir tk help filters, tk help dates).
     tk +tel
     tk project:maison due.before:+2w
     tk status:completed list

6. Personnalisez.
     tk config set language en  interface en anglais
     tk alias install task      lancer aussi tame avec task
     tk config set completion true   complétion par Tab (nouveaux terminaux)
     tk status:all export > sauvegarde.json

Toutes les commandes : tk help. Détails : tk help <commande>.
'''

credits = '''
TAME Arranges My Errands, par Skitourer.
https://github.com/Skitourer/tame

Merci à l'équipe et à la communauté Taskwarrior : TAME existe parce que Taskwarrior a
montré à quel point un gestionnaire de tâches en ligne de commande peut être bon, et
son format JSON ouvert permet aux outils de dialoguer. TAME est un projet indépendant
et ne partage aucun code avec lui.

Construit avec :
  rich              tableaux et couleurs
  python-dateutil   dates
  tomlkit           fichier de réglages qui garde vos commentaires

Réalisé avec uv, ruff, mypy, pytest et MkDocs Material.
Logo : une case cochée avec un petit cœur, qui fait partie de TAME (licence MIT).

Licences : tk help license.
'''
