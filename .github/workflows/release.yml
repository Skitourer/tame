name: Release

# Push a tag vX.Y.Z (matching __version__ and a CHANGELOG section) to publish:
# build and check -> PyPI (needs approval in the "pypi" environment) -> GitHub release.
# Run it by hand (Actions > Release > Run workflow) to rehearse the build job only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read  # jobs that need more say so themselves

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv run --no-project python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/tame/__init__.py').read_text())[1])")
          echo "tag=${GITHUB_REF_NAME} version=${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            version=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          fi
          uv run --no-project python scripts/release_notes.py "$version" > release-notes.md
          cat release-notes.md
      - name: Build
        run: uv build
      - name: Smoke test the wheel
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin"
          uv tool install dist/*.whl
          uv run --no-project python scripts/smoke.py "$UV_TOOL_BIN_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            release-notes.md

  pypi:
    name: publish to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tame-tasks/
    permissions:
      id-token: write  # trusted publishing: no token stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "TAME $GITHUB_REF_NAME"
          --notes-file release-notes.md
