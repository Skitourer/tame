name: Release

# Push a tag vX.Y.Z (matching __version__ and a CHANGELOG section) to publish:
# build and check -> PyPI (needs approval in the "pypi" environment) -> GitHub release.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/tame/__init__.py').read_text())[1])")
          echo "tag=${GITHUB_REF_NAME} version=${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Release notes
        run: uv run --no-project python scripts/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md
      - name: Build
        run: uv build
      - name: Smoke test the wheel
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin"
          uv tool install dist/*.whl
          uv run --no-project python scripts/smoke.py "$UV_TOOL_BIN_DIR"
      - uses: actions/upload-artifact@v5
        with:
          name: release
          path: |
            dist/
            release-notes.md

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tame-tasks/
    permissions:
      id-token: write  # trusted publishing: no token stored anywhere
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "TAME $GITHUB_REF_NAME"
          --notes-file release-notes.md
