name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --group docs
      - name: Build site
        run: uv run mkdocs build --strict
      - name: Coverage badge
        # shields.io endpoint read by the README badge.
        run: |
          uv run pytest -q --cov --cov-report=json:coverage.json
          mkdir -p site/badges
          uv run python - <<'EOF'
          import json
          percent = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = "brightgreen" if percent >= 95 else "green" if percent >= 90 else "red"
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{percent:.0f}%", "color": color}
          json.dump(badge, open("site/badges/coverage.json", "w"))
          EOF
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
