[project]
name = "tame"
dynamic = ["version"]
description = "TAME Arranges My Errands: a lightweight Taskwarrior-like CLI task manager."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Skitourer" }]
requires-python = ">=3.12"
dependencies = [
    "python-dateutil>=2.9",
    "rich>=13.9",
]
keywords = ["cli", "tasks", "todo", "taskwarrior"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/skitourer/tame"
Issues = "https://github.com/skitourer/tame/issues"
Changelog = "https://github.com/skitourer/tame/blob/main/CHANGELOG.md"

[project.scripts]
tame = "tame.__main__:main"
tk = "tame.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tame/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tame"]

# --- Lint / format -----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "PTH",      # pathlib
    "RUF",      # ruff-specific
    "D",        # pydocstyle
]

# Constructor args are documented in the class docstring (Google style).
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --- Types -------------------------------------------------------------------

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[tool.coverage.run]
source = ["tame"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
